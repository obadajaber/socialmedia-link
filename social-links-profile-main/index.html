<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .main {
      display: flex;
      background-color: hsl(0, 0%, 8%);
      border-radius: 12px;
      padding: 40px;
      width: 400px;
      text-align: center;
      margin: 0;

    }

    .img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 24px;
    }


    .name {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }


    .location {
      color: var(--text-location);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }


    .bio {
      color: var(--text-bio);
      font-size: 14px;
      margin-bottom: 24px;
    }
  </style>
</head>

<body>

  <div class="main">

    <img src="assets/images/avatar-jessica.jpeg" alt="Profile Picture" class="img">

    <h1 class="name">Obada jaber</h1>

    <p class="location">Amman, Jordan</p>

    <p class="bio">"Learning front-end development!"</p>

    <h2>New change</h2>
    <div class="links">

      <a href="#" class="link-button" target="_blank">GitHub</a>

      <a href="" class="link-button" target="_blank">Frontend Mentor</a>

      <a href="#" class="link-button" target="_blank">Linkedin</a>

      <a href="#" class="link-button" target="_blank">Twitter</a>

      <a href="#" class="link-button" target="_blank">instagrm</a>
    </div>
  </div>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
