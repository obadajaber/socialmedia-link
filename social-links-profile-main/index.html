<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <title> Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
   * {
     box-sizing: border-box;
     margin: 0;
     padding: 0;
   }


   body {
     background-color:  #141414;
     color: #ffffff;
     font-family: 'Inter', system-ui, -apple-system, sans-serif;
     display: flex;
     justify-content: center;
     align-items: center;
     min-height: 100vh;
     padding: 24px;
     -webkit-font-smoothing: antialiased;
   }


   .main {
     background-color: #1f1f1f;
     border-radius: 12px;
     padding: 40px;
     width: 100%;
     max-width: 384px;
     text-align: center;
     
   }


   .img {
     width: 88px;
     height: 88px;
     border-radius: 50%;
     object-fit: cover;
     margin-bottom: 24px;
   }


   .name {
     font-size: 24px;
     font-weight: 600;
     margin-bottom: 8px;
   }


   .location {
     color: #c5f82a;
     font-size: 14px;
     font-weight: 600;
     margin-bottom: 24px;
   }


   .bio {
     color:#b3b3b3;
     font-size: 14px;
     margin-bottom: 24px;
   }


   .links {
     display: flex;
     flex-direction: column;
     gap: 16px;
   }


   .link-button {
     background-color: red;
     color: #ffffff;
     text-decoration: none;
     padding: 16px;
     border-radius: 8px;
     font-weight: 600;
     font-size: 14px;
     transition: background-color 0.3s ease, color 0.3s ease, transform 0.1s ease;
   }


   .link-button:hover{
     background-color:#c5f82a;
     color: #333333;
     transform:translateY(-2px)
   }
  </style>
</head>
<body>

 <div class="main"> 
  
   <img src="assets/images/MyPhoto.jpg" alt="Profile Picture" class="img">

   <h1 class="name">Obada jaber</h1>

   <p class="location">Amman, Jordan</p>

   <p class="bio">"Trainee front-end development"</p>


   <div class="links">
    
     <a href="https://github.com/obadajaber" class="link-button" target="_blank">GitHub</a>
    
     <a href="https://www.frontendmentor.io/profile/obadajaber" class="link-button" target="_blank">Frontend Mentor</a>
    
     <a href="https://www.linkedin.com/in/obada-jaber-261465404/" class="link-button" target="_blank">Linkedin</a>
    
     <a href="https://www.facebook.com/share/18wtGSVUf5/?mibextid=wwXIfr" class="link-button" target="_blank">Facebook</a>
    
     <a href="https://www.instagram.com/obada_.j?igsh=dWZtcHFoMTJvdGs0&utm_source=qr" class="link-button" target="_blank">instagrm</a>
   </div>
   </div>
</body>
</html>
